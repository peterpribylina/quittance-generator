# Valenciennes - facture SUEZ n° 1100852426 du 29/09/2025 (septembre 2024 -
# septembre 2025, 158 m3, 1 164,76 € TTC en deux factures intermediaires).
#
#   part fixe      abonnement 57,50 €/an TTC  ->  0,1575 €/jour
#   part variable  1 107,25 € TTC / 158 m3    ->  7,0079 €/m3 TTC
#
#   du 07/04 au 23/09 : 0,3000 m3/jour  ->  2,1231 €/jour
#   du 24/09 au 06/04 : 0,5487 m3/jour  ->  3,8273 €/jour   (1,80 fois plus)
#
# Total reconstitue sur l'annee de bail : 1 223,00 € TTC (SUEZ provisionne
# 117 € par mois sur son echeancier, soit 1 170 €).
vals:
