--- # Charges relevees facture par facture, par maison et par mois.
#
# Un poste inscrit ici **remplace** la reference de `config.yaml`
# (`monthly_charges`) pour ce mois. C'est le fichier a editer pour corriger un
# montant : une facture d'eau qui s'ecarte de la provision, un mois d'internet
# offert, une electricite relevee sur facture.
#
# L'eau et l'internet sont portes sur toute l'annee de bail pour etre
# ajustables mois par mois sans toucher a `config.yaml`. Attention : un poste
# present ici est tenu pour **releve** et perd le `~` qui, dans
# `quittances charges`, signale un montant presume. Retirer une ligne la rend a
# la reference, et au marqueur.
#
# L'electricite se releve depuis les factures deposees dans
# <maison>/Charges/<annee>/ : `quittances factures --ecrire` l'inscrit.
#
# ---------------------------------------------------------------------------
# EAU : decomposee en part fixe (abonnement, du meme logement vide) et part
# variable (consommation, assainissement, redevances), comme l'electricite.
#
# Le montant de chaque mois suit **les m3 reellement releves sur ce mois**, et
# non un douzieme de l'annee. C'est ce qui permet a un locataire qui part avant
# l'ete de ne pas porter les mois creux — ni d'echapper aux mois pleins.
#
# Deux grandeurs distinctes, a ne pas melanger :
#
#   * la **saisonnalite** vient des m3/jour de chaque fenetre de relevi ;
#   * le **tarif** retenu est celui de la fenetre la plus recente, applique a
#     toute l'annee. Les deux fenetres d'une facture encadrent souvent une
#     revision tarifaire : garder le prix de l'ancienne reviendrait a facturer
#     l'ete 2027 au tarif de 2025.
#
# **Les montants portent en plus une majoration de 5 %**, prevision de hausse
# pour l'annee de bail 2026-2027.
# ---------------------------------------------------------------------------

# Anzin - facture SUEZ n° 1107630321 du 20/07/2026 (juillet 2025 - juillet 2026,
# 128 m3, 925,79 € TTC en deux factures intermediaires).
#
#   part fixe   abonnement distribution 57,55 €/an TTC  ->  0,1577 €/jour
#   tarif       6,8017 €/m3 TTC (fenetre 07/12/2025 - 08/07/2026)
#
#   du 09/07 au 06/12 : 0,3194 m3/jour
#   du 07/12 au 08/07 : 0,3832 m3/jour
#
# Le tarif de l'autre fenetre n'est que de 6,1346 €/m3 : GESAV reprend
# l'assainissement au 01/01/2026 et le rencherit de 10,9 %. C'est le tarif
# courant qui vaut pour une prevision.
#
# L'abonnement assainissement SUEZ (28,31 € TTC pour le 2e semestre 2025) est
# **exclu du forfait** : GESAV facture au m3 sans part fixe. Le reconduire
# surestimerait la part fixe de moitie.
#
# Total reconstitue sur l'annee de bail : 990,52 € TTC (SUEZ provisionne 93 €
# par mois sur son echeancier, soit 930 €).
anzin:
  2026-09: {eau_abonnement: 4.97, eau_consommation: 68.44, internet: 51.00}
  2026-10: {eau_abonnement: 5.13, eau_consommation: 70.72, internet: 51.00}
  2026-11: {eau_abonnement: 4.97, eau_consommation: 68.44, internet: 51.00}
  2026-12: {eau_abonnement: 5.13, eau_consommation: 82.10, internet: 51.00}
  2027-01: {eau_abonnement: 5.13, eau_consommation: 84.83, internet: 51.00}
  2027-02: {eau_abonnement: 4.64, eau_consommation: 76.62, internet: 51.00}
  2027-03: {eau_abonnement: 5.13, eau_consommation: 84.83, internet: 51.00}
  2027-04: {eau_abonnement: 4.97, eau_consommation: 82.10, internet: 51.00}
  2027-05: {eau_abonnement: 5.13, eau_consommation: 84.83, internet: 51.00}
  2027-06: {eau_abonnement: 4.97, eau_consommation: 82.10, internet: 51.00}
  2027-07: {eau_abonnement: 5.13, eau_consommation: 74.36, internet: 51.00}
  2027-08: {eau_abonnement: 5.13, eau_consommation: 70.72, internet: 51.00}

# Valenciennes - facture SUEZ n° 1100852426 du 29/09/2025 (septembre 2024 -
# septembre 2025, 158 m3, 1 164,76 € TTC en deux factures intermediaires).
#
#   part fixe   abonnement 57,50 €/an TTC  ->  0,1575 €/jour
#   tarif       7,0771 €/m3 TTC (fenetre 07/04 - 23/09/2025)
#
#   du 07/04 au 23/09 : 0,3000 m3/jour
#   du 24/09 au 06/04 : 0,5487 m3/jour   (1,83 fois plus l'hiver)
#
# L'autre fenetre est a 6,9750 €/m3 : la reforme des agences de l'eau du
# 01/01/2025 tombe en son milieu, l'ecart n'est que de 1,5 %.
#
# Total reconstitue sur l'annee de bail : 1 234,47 € TTC (SUEZ provisionne
# 117 € par mois sur son echeancier, soit 1 170 €).
vals:
  2026-09:
    eau_abonnement: 4.96
    eau_consommation: 79.82
    internet: 51.00
    # Facture du 28/08/2026 : l'abonnement du 23/08 au 22/09 couvre septembre.
    # La consommation de septembre viendra sur la facture suivante.
    # 19,99 € HT + TVA 20 % : c'est le TTC qui est decaisse. Releve sur
    # facture : pas de majoration previsionnelle.
    electricite: 23.99
