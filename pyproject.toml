[project]
name = "quittance-generator"
version = "2.0.0"
description = "Generation et envoi des quittances de loyer et attestations d'hebergement"
requires-python = ">=3.10"
dependencies = [
    "reportlab>=4.0",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pypdf>=4.0"]

[project.scripts]
quittances = "quittances.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["quittances"]

[tool.pytest.ini_options]
testpaths = ["tests"]
